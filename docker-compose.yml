services:
  web:
    build: ./NoteCloud_Config
    image: notecloud_cp-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./NoteCloud_Config/:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
      - ./.env.email
      - ./.env.providers
    depends_on:
      - db
      - minio
      - createbuckets
  db:
    image: postgres:16.4-alpine3.20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env.db
    ports:
      - "5432:5432"
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    volumes:
      - minio_data:/data
    env_file:
      - ./.env.s3
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add --api s3v4 s3 http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb s3/${MINIO_NAMEBUCKET}/;
      /usr/bin/mc anonymous set download s3/${MINIO_NAMEBUCKET};
      "


volumes:
  postgres_data:
     driver: local
  minio_data:
    driver: local