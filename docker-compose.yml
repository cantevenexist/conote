services:
  web:
    build: ./NoteCloud_Config
    image: notecloud_cp-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./NoteCloud_Config/:/usr/src/app/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev
    depends_on:
      - db
      - cache
  db:
    image: postgres:16.4-alpine3.20
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.db
    ports:
      - "5432:5432"
  cache:
    image: eqalpha/keydb:latest
    command: keydb-server --save 20 1 --loglevel warning
    volumes:
      - cache_data:/data
    env_file:
      - ./.env.cache_db
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  cache_data: