{% extends 'layout.html' %}
{% load static %}

{% block title %}
    Удалить новость
{% endblock %}

{% block head %}
<link rel="stylesheet" href="{% static 'news/css/index.css' %}">
<link rel="stylesheet" href="{% static 'news/css/detail.css' %}">
{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <div class="news_block_detail">
        <div class="news_action_buttons_container no_select">
            <button type="submit" class='news_action_button news_action_button_delete'>Удалить</button>
            <div class="separator"></div>
            <a href="{% url 'news_list' %}" class='news_action_button'>Назад</a>
        </div>
        <div class="news_post_link news_post">
            <p>Вы уверены, что хотите удалить "{{ object.title }}"?</p>
            <p>Данное дейстиве должно быть согласовано с администрацией.</p>
        </div>
    </div>
</form>
{% endblock %}
