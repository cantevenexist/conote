{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Istok+Web:ital,wght@1,700&family=Marmelad&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main_page/css/main_page.css' %}">
    <link rel="stylesheet" href="{% static 'main_page/css/news.css' %}">
    <link rel="stylesheet" href="{% static 'main_page/css/news_content.css' %}">
    <link rel="stylesheet" href="{% static 'main_page/css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'main_page/css/index.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.4.2/css/all.css">
</head>
<body>
    <div class="layout_header">
        <div class="logotype">
            <a href="/"><img src="{% static 'main_page/img/logo_web.png' %}" alt="logotype" border="0px"></a>
        </div>
        <div class="button_area">
            {% if user.is_authenticated %}
                <a href="user/login"><button class="button_login">{{ user.username }}</button></a>
            {% else %}
                <a href="user/login">
                    <button>Войти</button>
                </a>
            {% endif %}
        </div>
    </div>
    <div class="layout_central_block">
        {% block content %}
        {% endblock %}
    </div>
    {% block pagination %}
    {% endblock %}
</body>
<script>
    function getScreenPixelWidth() {
      const devicePixelRatio = window.devicePixelRatio || 1;
      const screenWidth = window.innerWidth;
      const zoomLevel = document.documentElement.style.zoom || 1;

      return screenWidth * devicePixelRatio / zoomLevel;
    }

    const layoutCentralBlock = document.querySelector('.layout_central_block');
    layoutCentralBlock.style.maxWidth = getScreenPixelWidth() + 'px';
</script>
</html>
